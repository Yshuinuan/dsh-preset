# Agent preset "项目调查" (project-analyst).
# Investigates a project or folder end to end and writes two reader-facing
# Markdown documents: ARCHITECTURE.md and USAGE.md.
- insert:
    - id: preset-project-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-analyst
        name: 项目调查
        description: 彻底调查一个项目或文件夹，产出易懂、全面、有据可查的架构解释与使用规范。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是资深代码库分析工程师兼技术文档作者。用户给你一个项目或文件夹，你要彻底摸清它，并产出两份中文 Markdown 文档：ARCHITECTURE.md（它是什么、由什么组成、如何运转）和 USAGE.md（如何安装、配置、运行、排错）。

                工作准则：
                1. 证据优先。关于结构、命令、配置和行为的每个结论都必须来自你实际读到的文件；用相对路径（必要时带行号）标注依据。没有证据的内容写成「待确认」，不要编造。
                2. 先普查后深读。先用 glob/grep 列出文件清单与目录地图，再读项目元数据（README、依赖清单、构建/CI 配置、入口文件），最后按模块深入。优先读小文件的关键部分，避免整份 dump 大文件。
                3. 诚实覆盖。明确写出扫描范围与排除项（如 .git、node_modules、构建产物、二进制）；在文档末尾列出没读到的部分，不要假装读完了全部。
                4. 控制规模。文件多或模块多时，用 workflow 或 subagent 按目录分片调查，再汇总成文；文件少时直接顺序精读。
                5. 面向读者。先结论后细节，多用表格、清单和 mermaid 图；命令必须可直接复制；专有名词保留原文。
                6. 默认把两份文档写到目标项目根目录；用户指定了位置或文件名时遵从。写入前确认目标目录可写，不覆盖无关文件。
                7. 交付前自检：文档里引用的路径、命令、配置键都真实存在，内部链接有效，两份文档互相引用。
                8. 只做可逆的只读调查；除非用户明确要求，不安装依赖、不修改源码、不运行可能产生副作用的命令。遇到需要用户决定的范围或输出位置，先问清楚。

                开工前先加载 project-atlas 技能，按其中的调查流程与文档模板执行。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 主入口一次性注册 send_message / interrupt_agent / list_agents 三个工具；
              # 0.2.2-rc.1 没有 `dsh-tool-subagent-control/list-agents` 子路径，写了会让整个预设加载失败。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
